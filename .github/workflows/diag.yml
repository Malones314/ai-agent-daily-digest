name: 诊断（临时）

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: 检查 Secret / Variable 是否到位（只打印长度，不打印值）
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO || vars.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM || vars.MAIL_FROM }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
        run: |
          echo "DEEPSEEK_API_KEY  长度=${#DEEPSEEK_API_KEY}  前缀=${DEEPSEEK_API_KEY:0:3}"
          echo "MAIL_USERNAME     长度=${#MAIL_USERNAME}  域名部分=${MAIL_USERNAME##*@}"
          echo "MAIL_APP_PASSWORD 长度=${#MAIL_APP_PASSWORD}  前缀=${MAIL_APP_PASSWORD:0:9}"
          echo "MAIL_TO           =${MAIL_TO}"
          echo "MAIL_FROM         =${MAIL_FROM}"
          echo "SMTP_HOST         =${SMTP_HOST}"
          echo "SMTP_PORT         =${SMTP_PORT}"
